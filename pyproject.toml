[project]
name = "network-packet-sniffer"
version = "0.5.0"
description = "A small object-oriented Tkinter network packet sniffer for Windows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Faraz Hussain"}]
requires-python = "==3.14.7"
dependencies = []

[project.gui-scripts]
network-packet-sniffer = "network_packet_sniffer.main:main"

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff==0.17.2"]
packaging = ["pyinstaller==6.22.3; sys_platform == 'win32'"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
