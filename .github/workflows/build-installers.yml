name: Build Windows installers

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft for the existing matching version tag at this commit
        type: boolean
        default: false
      signing_mode:
        description: Preview certificate or your production code-signing certificate
        type: choice
        options: [preview, certificate]
        default: preview
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-releases
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      UV_PYTHON: '3.14.7'
      SIGNING_MODE: ${{ inputs.signing_mode || 'preview' }}
    outputs:
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      artifact: installers-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install exact build environment
        run: uv sync --locked --group packaging --python 3.14.7
      - name: Validate source and release tag
        id: source
        env:
          CREATE_DRAFT: ${{ github.event_name == 'push' || inputs.create_draft }}
        shell: pwsh
        run: |
          $arguments = @('-m', 'release_tools.release', 'resolve')
          if ($env:CREATE_DRAFT -eq 'true') { $arguments += '--draft' }
          uv run --locked --group packaging python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release tag/source validation failed.' }
      - name: Run checks
        shell: pwsh
        run: |
          uv run --locked --group packaging python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          uv run --locked --group packaging ruff check .
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed.' }
          uv run --locked --group packaging ruff format --check .
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw 'Lock check failed.' }
      - name: Build both installers
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sniffer-signing.pfx'
          try {
            if ($env:SIGNING_MODE -eq 'certificate') {
              if (-not $env:WINDOWS_SIGNING_PFX_BASE64 -or -not $env:WINDOWS_SIGNING_PASSWORD -or -not $env:WINDOWS_PUBLISHER) {
                throw 'Certificate signing needs both secrets and WINDOWS_PUBLISHER. No preview fallback.'
              }
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
              ./packaging/build-installers.ps1 -SigningMode Certificate -PfxPath $pfx -Publisher $env:WINDOWS_PUBLISHER
            } else {
              ./packaging/build-installers.ps1 -SigningMode Preview
            }
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
      - name: Validate and smoke-test installers
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: ./packaging/test-installers.ps1 -ReleaseDirectory (Join-Path 'packaged-releases' $env:RELEASE_VERSION) -InstallExe
      - name: Upload installers, source, attribution, and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            packaged-releases/${{ steps.source.outputs.version }}/*-setup.exe
            packaged-releases/${{ steps.source.outputs.version }}/*.msix
            packaged-releases/${{ steps.source.outputs.version }}/*-source.zip
            packaged-releases/${{ steps.source.outputs.version }}/*-preview.cer
            packaged-releases/${{ steps.source.outputs.version }}/LICENSE
            packaged-releases/${{ steps.source.outputs.version }}/NOTICE
            packaged-releases/${{ steps.source.outputs.version }}/THIRD_PARTY_NOTICES.txt
            packaged-releases/${{ steps.source.outputs.version }}/release.json
            packaged-releases/${{ steps.source.outputs.version }}/SHA256SUMS.txt

  draft:
    if: github.event_name == 'push' || inputs.create_draft
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: packaged-releases/download
      - name: Verify artifacts and create draft
        shell: pwsh
        env:
          UV_PYTHON: '3.14.7'
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          uv sync --locked --no-dev
          uv run --locked --no-dev python -m release_tools.release verify --directory packaged-releases/download --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Artifact/source verification failed.' }
          ./packaging/create-draft.ps1 -Tag $env:RELEASE_TAG -Directory packaged-releases/download
